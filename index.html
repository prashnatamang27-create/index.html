99;max-width:700px;letter-spacing:-.045em}.hero p,.muted{color:var(--muted)}.hero p{max-width:650px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.actions button{flex:0 0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:.88rem}input,select{width:100%;padding:12px 13px;background:#0c1425;color:var(--text);border:1px solid var(--line);border-radius:11px;outline:none}input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #9da9ff22}.player-row{display:grid;grid-template-columns:39px 1fr;align-items:center;gap:9px;margin:8px 0}.number{width:36px;height:36px;display:grid;place-items:center;background:#293855;border-radius:12px;color:var(--mint);font-weight:900}.notice{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#0e172a;color:var(--muted);margin:12px 0}.notice strong{color:var(--text)}.role-card{padding:22px;margin:14px 0;border:1px solid #5c6db3;border-radius:18px;background:linear-gradient(135deg,#292f59,#143344)}.role-title{font-size:1.7rem;font-weight:950;margin:2px 0 8px}.clue{margin:12px 0;padding:13px 15px;border-left:4px solid var(--gold);border-radius:0 12px 12px 0;background:#2c2a3a}.fact{padding:12px 13px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:#0e1729}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:.83rem}.chip.active{border-color:#397c70;color:var(--mint);background:#142c32}.steps{display:flex;gap:6px;margin:14px 0}.steps span{height:5px;background:#2d3b56;border-radius:99px;flex:1}.steps span.on{background:var(--mint)}.option{display:flex;gap:10px;align-items:center;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#0d1729}.option input{width:auto;accent-color:var(--violet)}.option label{flex:1;cursor:pointer}.small{font-size:.86rem}.center{text-align:center}.large-number{font-size:2.7rem;font-weight:1000;color:var(--gold)}.error{color:var(--red);font-weight:750}.success{color:var(--mint);font-weight:800}.hr{height:1px;background:var(--line);margin:18px 0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reason-note{padding:10px 12px;border:1px dashed #435270;border-radius:12px;color:var(--muted);font-size:.85rem}.results-count{display:flex;align-items:center;gap:10px;margin:8px 0}.results-count .name{min-width:100px}.bar{height:9px;background:#283653;border-radius:20px;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--mint));border-radius:20px}.small-muted{color:#8593ae;font-size:.78rem}.footer{text-align:center;color:#7e8ba6;font-size:.78rem;padding:20px 0 0}.hide{display:none!important}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">?</div><div><h1>CATCH THE CULPRIT</h1><p>Think carefully. Connect the clues. Discover the truth.</p></div></div><div class="pill" id="headerPill">LOGIC MYSTERY</div></header>
<main id="app" aria-live="polite"></main>
<div class="footer">A social deduction and critical-thinking game · Fictional points only · One device, no server</div>

<script>
'use strict';
const CASES = [
 {title:'The Missing Trophy',category:'Timeline logic',brief:'The school trophy vanished between the last confirmed check and the 3:20 PM discovery. One witness has received altered evidence. Compare the timeline, access records, and physical clues to work out whose account cannot fit.',facts:[
  'A photograph at 3:00 PM shows the trophy cabinet closed and locked.',
  'Only one brass key can open the cabinet; the key register lists no spare.',
  'The brass key was inside a signed, tamper-evident envelope from 3:05 to 3:16 PM.',
  'The east hallway camera had no power from 3:10 to 3:12 PM.',
  'The cabinet alarm records its first opening at 3:18 PM.',
  'At 3:20 PM the cabinet was open, the trophy was missing, and the lock had no force damage.',
  'The official camera, key, and alarm clocks were checked and differed by no more than one minute.'
 ],clues:[
  {t:'The 3:00 PM photograph shows the cabinet closed and locked.',f:'The 3:00 PM photograph shows the cabinet already open.',why:'The verified 3:00 PM photograph shows a closed, locked cabinet.'},
  {t:'The key register lists exactly one working brass key and no spare.',f:'The key register lists a second working brass key.',why:'The key register lists one working brass key and no spare.'},
  {t:'The signed envelope seal stayed intact through 3:16 PM.',f:'The signed envelope seal was broken at 3:08 PM.',why:'The signed seal was recorded intact through 3:16 PM.'},
  {t:'The east hallway camera could not record footage at 3:11 PM.',f:'The east hallway camera recorded a clear image at 3:11 PM.',why:'The camera had no power from 3:10 to 3:12 PM.'},
  {t:'The alarm log lists 3:18 PM as the first cabinet-opening signal.',f:'The alarm log lists 3:08 PM as the first cabinet-opening signal.',why:"The alarm log's first cabinet-opening signal is 3:18 PM."},
  {t:'The lock inspection at 3:20 PM found no force damage.',f:'The lock inspection at 3:20 PM found fresh force damage.',why:'The inspection reported no force damage.'},
  {t:'The 3:20 PM check found the cabinet open and the trophy missing.',f:'The 3:20 PM check found the trophy still inside the cabinet.',why:'The signed 3:20 PM check records an empty cabinet.'},
  {t:'The checked clocks differed by no more than one minute.',f:'The checked key clock was more than ten minutes behind the alarm clock.',why:'The clock check found a maximum difference of one minute.'}
 ]},
 {title:'The Switched Delivery',category:'Record comparison',brief:'A sealed parcel arrived with the wrong contents. The team has to reconstruct which account does not fit the delivery records. Small differences in times, seals, and labels matter.',facts:[
  'Parcel A was scanned at Dock 2 at 10:00 AM.',
  'Parcel A had a red tamper strip; the strip was photographed intact at 10:18 AM.',
  'The cold-room door was sealed from 10:05 to 10:20 AM.',
  'The calibrated scale recorded Parcel A as 2.4 kg at 10:22 AM.',
  'The delivery van left at 10:30 AM.',
  'The receiver signed for Parcel A at 10:42 AM.',
  'The tracking system recorded one unique code for Parcel A; the system clock was synchronized.'
 ],clues:[
  {t:'Parcel A was scanned at Dock 2 at 10:00 AM.',f:'Parcel A was scanned at Dock 3 at 10:00 AM.',why:'The verified scan location is Dock 2.'},
  {t:'The photographed tamper strip was red and intact at 10:18 AM.',f:'The photographed tamper strip was blue at 10:18 AM.',why:'The verified photograph shows a red strip.'},
  {t:'The cold-room door remained sealed through 10:20 AM.',f:'The cold-room door was opened at 10:12 AM.',why:'The seal log confirms the door was sealed from 10:05 to 10:20.'},
  {t:'The scale recorded a weight of 2.4 kg at 10:22 AM.',f:'The scale recorded a weight of 4.2 kg at 10:22 AM.',why:'The calibrated scale record is 2.4 kg.'},
  {t:'The van departed at 10:30 AM.',f:'The van departed at 10:20 AM.',why:'The dispatch record confirms 10:30 AM.'},
  {t:'The receiver signed the delivery record at 10:42 AM.',f:'The receiver signed the delivery record at 10:32 AM.',why:'The signed record is timestamped 10:42 AM.'},
  {t:'Parcel A used a unique tracking code.',f:'Parcel A shared its tracking code with a second parcel.',why:'The tracking system lists one unique code for Parcel A.'},
  {t:'The seal photograph was taken after the cold-room door was sealed.',f:'The seal photograph was taken before the cold-room door was sealed.',why:'The photograph is timestamped 10:18 AM, inside the 10:05–10:20 sealed interval.'}
 ]},
 {title:'The Library Page',category:'Sequence and access',brief:'A rare page disappeared from a local archive. Several records seem normal at first, but a single altered report conflicts with the access sequence. Reconstruct what could and could not have happened.',facts:[
  'The archive cabinet was locked at 8:00 AM and opened by the librarian at 9:00 AM.',
  'The cabinet key remained in a locked drawer from 8:10 to 8:50 AM.',
  'The reading-room entry log shows the room closed to visitors from 8:30 to 8:45 AM.',
  'The scanner was unplugged from 8:20 to 8:40 AM.',
  'The archive inventory was complete at 8:00 AM; the page was missing at 9:00 AM.',
  'The room clock and entry log were synchronized within one minute.'
 ],clues:[
  {t:'The cabinet was locked at 8:00 AM.',f:'The cabinet was open at 8:00 AM.',why:'The opening checklist confirms it was locked at 8:00 AM.'},
  {t:'The cabinet key was in the locked drawer at 8:30 AM.',f:'The cabinet key was on the reading table at 8:30 AM.',why:'The key remained in the locked drawer from 8:10 to 8:50 AM.'},
  {t:'Visitors could not enter the reading room at 8:35 AM.',f:'Visitors were admitted to the reading room at 8:35 AM.',why:'The room was closed to visitors from 8:30 to 8:45 AM.'},
  {t:'The scanner could not scan pages at 8:30 AM.',f:'The scanner completed a page scan at 8:30 AM.',why:'The scanner was unplugged from 8:20 to 8:40 AM.'},
  {t:'The 8:00 AM inventory listed the rare page as present.',f:'The 8:00 AM inventory listed the rare page as already missing.',why:'The signed inventory was complete at 8:00 AM.'},
  {t:'The page was confirmed missing at the 9:00 AM check.',f:'The page was confirmed present at the 9:00 AM check.',why:'The 9:00 AM inventory reports the page missing.'},
  {t:'The room clock and entry log differed by at most one minute.',f:'The entry log was fifteen minutes ahead of the room clock.',why:'The synchronization check found a difference of no more than one minute.'},
  {t:'The librarian opened the cabinet at 9:00 AM.',f:'The librarian opened the cabinet at 8:30 AM.',why:"The cabinet access record lists the librarian's opening at 9:00 AM."}
 ]},
 {title:'The Greenhouse Switch',category:'Cause and effect',brief:'A rare seed tray was moved and its labels were mixed up. The greenhouse team must figure out which report conflicts with the environmental controls and the movement log.',facts:[
  'The greenhouse south door was sealed from 7:00 to 7:30 AM.',
  'The irrigation valve was shut for pipe repair from 7:05 to 7:25 AM.',
  'The heater timer was disabled from 7:00 to 7:20 AM.',
  'A photo at 7:00 AM shows the blue-label tray on Shelf B.',
  'A photo at 7:30 AM shows the blue-label tray on Bench A.',
  'The trolley track sensor recorded one trolley trip from Shelf B toward Bench A at 7:22 AM.'
 ],clues:[
  {t:'The south door remained sealed at 7:15 AM.',f:'The south door was opened at 7:15 AM.',why:'The door seal record covers the full 7:00–7:30 interval.'},
  {t:'The irrigation valve was shut at 7:15 AM.',f:'The irrigation valve was running at 7:15 AM.',why:'The repair log says the valve was shut until 7:25 AM.'},
  {t:'The heater timer was disabled at 7:10 AM.',f:'The heater timer was active at 7:10 AM.',why:'The heater timer remained disabled until 7:20 AM.'},
  {t:'The 7:00 AM photo places the blue-label tray on Shelf B.',f:'The 7:00 AM photo places the blue-label tray on Bench A.',why:'The verified 7:00 AM photograph shows Shelf B.'},
  {t:'The 7:30 AM photo places the blue-label tray on Bench A.',f:'The 7:30 AM photo places the blue-label tray on Shelf B.',why:'The verified 7:30 AM photograph shows Bench A.'},
  {t:'The trolley sensor recorded a trip at 7:22 AM.',f:'The trolley sensor recorded a trip at 7:12 AM.',why:'The sensor timestamp is 7:22 AM.'},
  {t:'The recorded trolley route was from Shelf B toward Bench A.',f:'The recorded trolley route was from Bench A toward Shelf B.',why:'The direction sensor records Shelf B toward Bench A.'},
  {t:'The two tray photographs were taken thirty minutes apart.',f:'The two tray photographs were taken ten minutes apart.',why:'The photos are timestamped 7:00 and 7:30 AM.'}
 ]},
 {title:'The Gallery Copy',category:'Pattern and detail',brief:'An original drawing was replaced by a copy. The gallery team has a checklist, storage log, and inspection notes. Compare small details to discover which report does not fit.',facts:[
  'The original drawing has a blue corner mark and no signature on the back.',
  'The copy has a green corner mark and a small signature on the back.',
  'The display case was sealed from 4:00 to 4:30 PM.',
  'The storage cabinet sensor recorded one opening at 4:34 PM.',
  'The inspection photograph at 4:40 PM shows a green corner mark in the display case.',
  'The gallery checklist clock and sensor clock were synchronized within one minute.'
 ],clues:[
  {t:'The original drawing has a blue corner mark.',f:'The original drawing has a green corner mark.',why:"The catalog describes the original's corner mark as blue."},
  {t:'The copy has a green corner mark.',f:'The copy has a blue corner mark.',why:"The catalog describes the copy's corner mark as green."},
  {t:'The original has no signature on the back.',f:'The original has a signature on the back.',why:"The original's catalog entry records no signature."},
  {t:'The copy has a small signature on the back.',f:'The copy has no signature on the back.',why:"The copy's catalog entry records a small signature."},
  {t:'The display case remained sealed through 4:30 PM.',f:'The display case was unsealed at 4:15 PM.',why:'The seal log covers 4:00–4:30 PM.'},
  {t:'The storage cabinet sensor logged an opening at 4:34 PM.',f:'The storage cabinet sensor logged an opening at 4:14 PM.',why:"The sensor's only opening record is 4:34 PM."},
  {t:'The 4:40 PM inspection photo shows a green corner mark in the case.',f:'The 4:40 PM inspection photo shows a blue corner mark in the case.',why:'The inspection photo shows a green corner mark.'},
  {t:'The checklist and sensor clocks differed by no more than one minute.',f:'The sensor clock was twenty minutes behind the checklist clock.',why:'The clock check found a maximum difference of one minute.'}
 ]},
 {title:'The Platform Envelope',category:'Deductive timeline',brief:'A sealed envelope disappeared from a station waiting area shortly before a train left. The statements mention platform access, announcements, and a receipt. Find the account that cannot fit the verified timeline.',facts:[
  'The platform gate was closed to passengers from 6:00 to 6:10 PM.',
  'The train departed at 6:12 PM according to the station clock.',
  'The lost-envelope desk issued receipt 184 at 5:55 PM.',
  'The station announcement system was offline from 6:03 to 6:07 PM.',
  'The platform clock and ticket gate clock were synchronized within one minute.',
  'The envelope was logged in the waiting-area cabinet at 5:50 PM and reported missing at 6:15 PM.'
 ],clues:[
  {t:'Passengers could not pass through the platform gate at 6:05 PM.',f:'Passengers passed through the platform gate at 6:05 PM.',why:'The gate was closed from 6:00 to 6:10 PM.'},
  {t:'The train departed at 6:12 PM.',f:'The train departed at 6:02 PM.',why:'The station departure log records 6:12 PM.'},
  {t:'Receipt 184 was issued at 5:55 PM.',f:'Receipt 184 was issued at 6:05 PM.',why:'The original receipt is timestamped 5:55 PM.'},
  {t:'The announcement system could not broadcast at 6:05 PM.',f:'The announcement system broadcast an announcement at 6:05 PM.',why:'The system was offline from 6:03 to 6:07 PM.'},
  {t:'The platform and gate clocks differed by at most one minute.',f:'The platform clock was twelve minutes ahead of the gate clock.',why:'The synchronization check found a difference of no more than one minute.'},
  {t:'The envelope was logged in the cabinet at 5:50 PM.',f:'The envelope was logged in the cabinet at 6:10 PM.',why:'The cabinet inventory records 5:50 PM.'},
  {t:'The envelope was reported missing at 6:15 PM.',f:'The envelope was reported missing at 6:05 PM.',why:'The missing-property record is timestamped 6:15 PM.'},
  {t:'The platform gate reopened after 6:10 PM.',f:'The platform gate reopened at 6:05 PM.',why:'The gate record says the gate remained closed until 6:10 PM.'}
 ]}
];
const REASONS=['A statement conflicts with a verified fact','The timeline does not fit','Two explanations contradict each other','The explanation changed','An important question was avoided','Another reason'];
const $=s=>document.querySelector(s); const app=$('#app');
const S={screen:'home',playerCount:4,players:[],active:[],case:null,round:1,roleIndex:0,roleStage:'ready',votes:[],voteIndex:0,voteMode:'normal',voteParticipants:[],tieUsed:false,tied:[],eliminated:[],evidenceBoard:[],lastResult:null,winner:null,winnerReason:'',specialIndex:0,specialVotes:[],error:''};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function byId(id){return S.players.find(p=>p.id===id)} function activePlayers(){return S.active.map(byId)} function culprit(){return S.players.find(p=>p.role==='culprit');}
function setScreen(name){S.screen=name;render();window.scrollTo({top:0,behavior:'smooth'});}
function baseCard(content,cls=''){return `<section class="card ${cls}">${content}</section>`;}
function actionRow(items){return `<div class="actions">${items.join('')}</div>`;}
function btn(label,act,cls=''){return `<button type="button" class="${cls}" data-action="${act}">${label}</button>`;}
function headerProgress(){if(!S.players.length||['home','rules','setup','final'].includes(S.screen))return;const r=Math.min(S.round,3);return `<div class="steps"><span class="on"></span><span class="${r>=2?'on':''}"></span><span class="${r>=3?'on':''}"></span></div>`;}
function render(){
 $('#headerPill').textContent = S.screen==='home'?'LOGIC MYSTERY':S.screen==='final'?'CASE CLOSED':`ROUND ${S.round} OF 3`;
 switch(S.screen){case'home':app.innerHTML=home();break;case'rules':app.innerHTML=rules();break;case'setup':app.innerHTML=setup();break;case'role':app.innerHTML=roleScreen();break;case'investigation':app.innerHTML=investigation();break;case'vote':app.innerHTML=voteScreen();break;case'passVote':app.innerHTML=passVote();break;case'voteResults':app.innerHTML=voteResults();break;case'showdownIntro':app.innerHTML=showdownIntro();break;case'showdown':app.innerHTML=showdownScreen();break;case'passShowdown':app.innerHTML=passShowdown();break;case'final':app.innerHTML=finalScreen();break;default:app.innerHTML=home();}
}
function home(){return `${baseCard(`<div class="eyebrow">A MYSTERY THAT MAKES YOU THINK</div><h2>Think deeper.<br>Catch the culprit.</h2><p>Every player holds a piece of the story. One piece has been altered. Ask sharp questions, connect facts, spot contradictions, and make a difficult choice.</p><div class="grid"><div class="fact"><h4>01 · Investigate</h4><div class="muted small">Share evidence, ask questions, and compare explanations.</div></div><div class="fact"><h4>02 · Deduce</h4><div class="muted small">Find what cannot be true, not just who feels suspicious.</div></div><div class="fact"><h4>03 · Decide</h4><div class="muted small">Vote in secret, face consequences, and learn from each reveal.</div></div></div>${actionRow([btn('Play Game','go-setup','good'),btn('How to Play','rules','secondary')])}`,'hero')}`;}
function rules(){return `${baseCard(`<div class="eyebrow">HOW TO PLAY</div><h2>Use evidence, not guesses.</h2><div class="grid"><div class="fact"><h4>1. Private roles</h4><p class="muted small">One player is the culprit. Everyone else is innocent. Each player receives one private evidence card.</p></div><div class="fact"><h4>2. Compare clues</h4><p class="muted small">Innocent evidence is truthful. The culprit's evidence is altered. Ask questions aloud and compare every statement with the case facts.</p></div><div class="fact"><h4>3. Vote secretly</h4><p class="muted small">Each active player secretly accuses one other player and selects a reason. Partial votes stay hidden.</p></div><div class="fact"><h4>4. Learn from mistakes</h4><p class="muted small">If an innocent player is eliminated, their truthful clue is revealed. You gain evidence but lose an investigator.</p></div></div><div class="notice"><strong>Win:</strong> Catch the culprit before the end of round 3. <strong>Culprit wins:</strong> survive through round 3. Each game has a 1,000-point fictional reward pool.</div><p class="muted small">Play together in person on one shared device. The website does not listen to conversations or judge answers automatically.</p>${actionRow([btn('Start a Game','go-setup','good'),btn('Back','home','secondary')])}`)}`;}
function setup(){let n=S.playerCount;return `${baseCard(`<div class="eyebrow">NEW CASE</div><h2>Who's in the room?</h2><p class="muted">Choose 4–8 players, then enter everyone's name. The culprit and the case are selected randomly.</p><div class="field"><label for="playerCount">Number of players</label><select id="playerCount">${[4,5,6,7,8].map(x=>`<option value="${x}" ${n===x?'selected':''}>${x} players</option>`).join('')}</select></div><div id="names">${Array.from({length:n},(_,i)=>`<div class="player-row"><div class="number">${i+1}</div><input id="player${i}" maxlength="22" placeholder="Player ${i+1} name" value="${esc(S.nameDraft?.[i]||'')}" autocomplete="off"></div>`).join('')}</div><div id="setupError" class="error" role="alert">${esc(S.error)}</div>${actionRow([btn('Create Case & Assign Roles','start-game','good'),btn('Back to Home','home','secondary')])}`)}`;}
function roleScreen(){const p=S.players[S.roleIndex];if(!p)return '';const last=S.roleIndex===S.players.length-1;let content=`<div class="eyebrow">PRIVATE ROLE REVEAL · PLAYER ${p.id+1}</div><h2>Pass the device to ${esc(p.name)}.</h2><p class="muted">Only ${esc(p.name)} should look at the screen. Everyone else, look away.</p>`;
 if(S.roleStage==='ready')content+=`<div class="notice">Tap below when the player is ready. The role and clue will remain hidden until revealed.</div>${actionRow([btn('Reveal My Role','reveal-role','good')])}`;
 if(S.roleStage==='shown')content+=`<div class="role-card"><div class="eyebrow">YOUR SECRET ROLE</div><div class="role-title">${p.role==='culprit'?'You are the CULPRIT':'You are INNOCENT'}</div><p>${p.role==='culprit'?'Your evidence has been altered. Try to blend in, explain it convincingly, and avoid being eliminated. Do not admit the clue is altered.':'Your evidence is truthful. Look for contradictions, ask useful questions, and decide what to share with the group.'}</p><div class="clue"><strong>Your private evidence</strong><br>${esc(p.clueText)}</div><p class="small muted">Remember your clue. You may share it or keep details back during discussion.</p></div>${actionRow([btn('Hide My Role','hide-role','warn')])}`;
 if(S.roleStage==='hidden')content+=`<div class="notice"><strong>Role hidden.</strong> Pass the device before continuing. Do not say your role aloud.</div>${actionRow([btn(last?'Finish Setup & Start Investigation':'Pass to Next Player','next-role','good')])}`;
 return baseCard(content);
}
function exposedEvidence(){if(!S.evidenceBoard.length)return `<div class="notice">No eliminated player's evidence has been revealed yet. Each wrong elimination will add one verified clue.</div>`;return S.evidenceBoard.map((e,i)=>`<div class="fact"><div class="tag">VERIFIED EVIDENCE ${i+1} · ROUND ${e.round}</div><p><strong>${esc(e.playerName)}'s clue:</strong> ${esc(e.text)}</p></div>`).join('');}
function investigation(){let ps=activePlayers();return `${headerProgress()}${baseCard(`<div class="eyebrow">CASE FILE · ${esc(S.case.category)}</div><h2>${esc(S.case.title)}</h2><p>${esc(S.case.brief)}</p><div class="hr"></div><h3>Verified public facts</h3><div class="facts">${S.case.facts.map((f,i)=>`<div class="fact"><span class="tag">FACT ${i+1}</span><div style="margin-top:6px">${esc(f)}</div></div>`).join('')}</div><div class="hr"></div><h3>Evidence board</h3>${exposedEvidence()}`)}${baseCard(`<div class="eyebrow">ROUND ${S.round} · INVESTIGATE</div><h3>Challenge your first explanation.</h3><div class="notice"><strong>Talk it through before voting:</strong><br>Which detail can be checked against the timeline? What would have to be true for each explanation to work? Which question could prove or disprove a suspicion?</div><div class="grid"><div class="fact"><h4>Ask</h4><p class="muted small">Create your own questions. Ask players to explain how their evidence fits the public facts.</p></div><div class="fact"><h4>Compare</h4><p class="muted small">Look for incompatible times, impossible access, or details that cannot both be true.</p></div><div class="fact"><h4>Revise</h4><p class="muted small">Change your mind when new evidence is stronger than your first impression.</p></div></div><h4>Players still in the game</h4><div class="chips">${ps.map(p=>`<span class="chip active">#${p.id+1} ${esc(p.name)}</span>`).join('')}</div><p class="muted small">Everyone should have a chance to ask and answer. The site does not record voice or decide who sounds guilty.</p>${actionRow([btn(S.round===3&&ps.length===2?'Begin Final Showdown':'Start Secret Voting','start-vote','good')])}`)}`;}
function voteScreen(){let voter=activePlayers()[S.voteIndex];if(!voter)return '';const candidates=(S.voteMode==='revote'?S.tied:S.active).filter(id=>id!==voter.id).map(byId);return `${headerProgress()}${baseCard(`<div class="eyebrow">${S.voteMode==='revote'?'TIE-BREAK VOTE':'SECRET VOTE'} · VOTER ${S.voteIndex+1} OF ${S.active.length}</div><h2>${esc(voter.name)}, make your decision.</h2><p class="muted">Only you should look at this screen. Select one other active player. Your vote and reason will stay hidden until everyone submits.</p><form id="voteForm"><h3>Who do you accuse?</h3>${candidates.map(p=>`<div class="option"><input type="radio" name="voteTarget" id="target${p.id}" value="${p.id}" required><label for="target${p.id}"><strong>#${p.id+1} ${esc(p.name)}</strong><div class="small muted">Active player</div></label></div>`).join('')}<div class="field"><label for="voteReason">What is your main reason?</label><select id="voteReason" required><option value="">Choose a reason…</option>${REASONS.map((r,i)=>`<option value="${i}">${esc(r)}</option>`).join('')}</select></div><div class="notice small">A reason helps you examine your thinking. It does not add extra votes or prove guilt by itself.</div><button type="submit" class="good">Lock My Vote</button></form>`)}`;}
function passVote(){const next=activePlayers()[S.voteIndex];return `${baseCard(`<div class="center"><div class="eyebrow">VOTE SEALED</div><h2>Your choice is hidden.</h2><div class="logo" style="margin:16px auto">✓</div><p class="muted">Pass the device to the next voter. Do not reveal your choice or discuss votes until everyone has finished.</p><div class="notice"><strong>Next voter:</strong> ${next?`#${next.id+1} ${esc(next.name)}`:'Final vote processing'}</div>${actionRow([btn('Continue to Next Voter','continue-vote','good')])}</div>`)}`;}
function tally(votes){let obj={};(S.voteParticipants.length?S.voteParticipants:S.active).forEach(id=>obj[id]=0);votes.forEach(v=>{if(v.target!==null&&obj[v.target]!==undefined)obj[v.target]++;});return obj;}
function barList(votes){let counts=tally(votes),max=Math.max(1,...Object.values(counts));return (S.voteParticipants.length?S.voteParticipants:S.active).map(byId).map(p=>`<div class="results-count"><div class="name small">#${p.id+1} ${esc(p.name)}</div><div class="bar"><span style="width:${counts[p.id]/max*100}%"></span></div><strong>${counts[p.id]||0}</strong></div>`).join('');}
function reasonSummary(votes){let c={};votes.forEach(v=>{if(v.reason!==null)c[v.reason]=(c[v.reason]||0)+1;});let arr=Object.entries(c).sort((a,b)=>b[1]-a[1]);if(!arr.length)return '';return `<div class="notice"><strong>Thinking patterns (anonymous):</strong><br>${arr.map(([id,n])=>`${esc(REASONS[+id])} (${n})`).join(' · ')}</div>`;}
function voteResults(){
 const r=S.lastResult;if(!r)return '';
 let content=`<div class="eyebrow">VOTE RESULTS · ROUND ${S.round}</div><h2>${r.title||'The votes are in.'}</h2>`;
 if(r.type==='showdown'){
  content+=`<div class="role-card"><div class="eyebrow">FINAL SHOWDOWN</div><p>${esc(r.message||'The final choices are revealed.')}</p><p class="muted small">A single accusation only succeeds when the other player stands down. Matching choices leave the culprit in the game.</p></div>${actionRow([btn('See Final Results','final','good')])}`;
  return baseCard(content);
 }
 content+=`<p class="muted">The choices were hidden until everyone voted. Now compare the result with the evidence.</p><h3>Vote totals</h3>${r.votes&&r.votes.length?barList(r.votes):'<p class="muted">No votes were cast.</p>'}${reasonSummary(r.votes||[])}`;
 if(r.type==='tie')content+=`<div class="notice"><strong>It's a tie.</strong> The tied players will face one more secret vote. No one has been eliminated yet.</div>${actionRow([btn('Run Tie-Break Vote','start-revote','warn')])}`;
 else if(r.type==='eliminated'){
  const p=byId(r.target);
  content+=`<div class="role-card"><div class="eyebrow">ELIMINATED</div><div class="role-title">#${p.id+1} ${esc(p.name)}</div><p>This player's role is now revealed: <strong>${p.role==='culprit'?'CULPRIT':'INNOCENT'}</strong>.</p><div class="clue"><strong>${p.role==='culprit'?'Altered evidence revealed':'Verified evidence added to the board'}</strong><br>${esc(p.clueText)}</div>${p.role==='culprit'?`<p><strong>Why the clue conflicts:</strong> ${esc(p.clueWhy)}</p>`:`<p class="muted small">The truthful clue is now available to everyone. Use it to improve your next deduction.</p>`}</div>`;
  if(S.winner)content+=actionRow([btn('See Final Results','final','good')]);else content+=actionRow([btn('Review Evidence & Continue','next-round','good')]);
 }else if(r.type==='noElimination'){
  content+=`<div class="notice"><strong>No one is eliminated.</strong> The revote was also tied. No role or clue is revealed.</div>${S.winner?actionRow([btn('See Final Results','final','good')]):actionRow([btn('Review Evidence & Continue','next-round','good')])}`;
 }
 return baseCard(content);
}
function showdownIntro(){return `${headerProgress()}${baseCard(`<div class="eyebrow">FINAL ROUND · TWO PLAYERS REMAIN</div><h2>The final mind game.</h2><p class="muted">Only two players remain. Both must choose privately between accusing the other player and standing down. The choices reveal how each person responds under pressure.</p><div class="notice"><strong>Rule:</strong> If one player accuses and the other stands down, the accused is eliminated. If both accuse each other or both stand down, nobody is eliminated and the culprit survives.</div><p class="small muted">This is a strategic bluff. Think about the evidence, what the other player expects, and the risk of a mutual accusation.</p>${actionRow([btn('Start Final Showdown','begin-showdown','good')])}`)}`;}
function showdownScreen(){const p=S.active[S.specialIndex];const other=S.active.map(byId).find(x=>x.id!==p);return `${baseCard(`<div class="eyebrow">FINAL SHOWDOWN · PLAYER ${S.specialIndex+1} OF 2</div><h2>${esc(p.name)}, choose privately.</h2><p class="muted">Do not let the other player see your choice. This decision cannot be changed after submission.</p><div class="option"><input type="radio" id="sdAccuse" name="showdownChoice" value="accuse"><label for="sdAccuse"><strong>Accuse ${esc(other.name)}</strong><div class="small muted">You believe the other player is the culprit.</div></label></div><div class="option"><input type="radio" id="sdStand" name="showdownChoice" value="stand"><label for="sdStand"><strong>Stand down</strong><div class="small muted">Do not make a final accusation.</div></label></div>${actionRow([btn('Seal My Decision','submit-showdown','good')])}<div id="sdError" class="error"></div>`)}`;}
function passShowdown(){const next=S.active[S.specialIndex];return `${baseCard(`<div class="center"><div class="eyebrow">FINAL CHOICE SEALED</div><h2>Pass the device.</h2><p class="muted">The first choice is hidden. The next player must decide without seeing it.</p><div class="notice"><strong>Next player:</strong> ${next?esc(next.name):'Resolving final choices'}</div>${actionRow([btn('Continue','continue-showdown','good')])}</div>`)}`;}
function finalScreen(){let pool=S.winner==='culprit'? [{p:culprit(),points:1000}]:S.rewardShares||[];let clue=culprit();let ev=S.evidenceBoard;let rewardRows=pool.map(x=>`<div class="fact"><strong>#${x.p.id+1} ${esc(x.p.name)}</strong><span style="float:right;color:var(--gold);font-weight:900">${x.points} pts</span></div>`).join('');return `${baseCard(`<div class="center"><div class="eyebrow">CASE CLOSED</div><div class="large-number">${S.winner==='culprit'?'CULPRIT WINS':'INNOCENTS WIN'}</div><h2>${S.winner==='culprit'?`${esc(clue.name)} escaped detection.`:'The culprit was caught.'}</h2><p class="muted">${esc(S.winnerReason)}</p><div class="role-card"><div class="eyebrow">THE CULPRIT WAS</div><div class="role-title">#${clue.id+1} ${esc(clue.name)}</div><p class="clue"><strong>Altered evidence:</strong><br>${esc(clue.clueText)}</p><p><strong>Contradiction:</strong> ${esc(clue.clueWhy)}</p></div></div><div class="hr"></div><h3>Final role reveal</h3>${S.players.map(p=>`<div class="fact"><strong>#${p.id+1} ${esc(p.name)}</strong><span class="tag" style="float:right;color:${p.role==='culprit'?'var(--red)':'var(--mint)'}">${p.role==='culprit'?'CULPRIT':'INNOCENT'}</span><div class="small muted" style="clear:both;padding-top:7px">${esc(p.clueText)}</div></div>`).join('')}<div class="hr"></div><h3>Elimination history</h3>${S.eliminated.length?S.eliminated.map(e=>`<div class="fact">Round ${e.round}: <strong>${esc(e.name)}</strong> — ${e.role==='culprit'?'culprit':'innocent'}</div>`).join(''):'<p class="muted">No player was eliminated.</p>'}<div class="hr"></div><h3>Reward breakdown</h3><div class="large-number">1,000 points</div><p class="muted small">Fictional points only. Innocents eliminated before the culprit was caught do not share the reward.</p>${rewardRows}<div class="hr"></div><h3>What the case taught you</h3><p class="muted">Strong deduction means checking whether details can all be true at the same time. A confident answer is not proof. Compare statements with reliable facts, notice contradictions, and revise your theory when new evidence appears.</p>${actionRow([btn('Play Another Case','go-setup','good'),btn('Home','reset-home','secondary')])}`)}`;}
function startGame(){const count=+$('#playerCount').value;let names=[];for(let i=0;i<count;i++){const x=$(`#player${i}`);names.push((x?.value||'').trim());}S.nameDraft=names;let err='';if(names.some(n=>!n))err='Please enter a name for every player.';const norm=names.map(n=>n.toLocaleLowerCase());if(!err&&new Set(norm).size!==norm.length)err='Each player needs a different name so votes are unambiguous.';if(err){S.playerCount=count;S.error=err;render();return;}S.error='';S.playerCount=count;const c=CASES[Math.floor(Math.random()*CASES.length)];const culpritIndex=Math.floor(Math.random()*count);const clueOrder=shuffle(c.clues.map((_,i)=>i));S.players=names.map((name,i)=>{const ci=clueOrder[i],role=i===culpritIndex?'culprit':'innocent',cl=c.clues[ci];return{id:i,name,role,clueIndex:ci,clueText:role==='culprit'?cl.f:cl.t,clueWhy:role==='culprit'?cl.why:'',trueClue:cl.t,alteredClue:cl.f,active:true};});S.case=c;S.active=S.players.map(p=>p.id);S.voteParticipants=[...S.active];S.round=1;S.roleIndex=0;S.roleStage='ready';S.votes=[];S.voteIndex=0;S.voteMode='normal';S.tieUsed=false;S.tied=[];S.eliminated=[];S.evidenceBoard=[];S.lastResult=null;S.winner=null;S.winnerReason='';S.rewardShares=[];S.specialIndex=0;S.specialVotes=[];S.screen='role';render();}
function startVoting(mode='normal',candidates=null){S.voteMode=mode;S.tied=candidates||[];S.voteParticipants=[...S.active];S.votes=[];S.voteIndex=0;S.screen='vote';render();}
function submitVote(){const voter=S.active[S.voteIndex];const selected=document.querySelector('input[name="voteTarget"]:checked');const reason=$('#voteReason')?.value;if(!selected||reason===''){alert('Choose a player and a reason before locking your vote.');return;}const target=+selected.value;if(target===voter||!S.active.includes(target)){alert('Choose a different active player.');return;}S.votes.push({voter,target,reason});if(S.voteIndex<S.active.length-1){S.voteIndex++;S.screen='passVote';render();}else resolveVotes();}
function resolveVotes(){const counts={};S.votes.forEach(v=>counts[v.target]=(counts[v.target]||0)+1);const max=Math.max(0,...Object.values(counts));const top=Object.keys(counts).filter(k=>counts[k]===max).map(Number);if(top.length!==1){if(S.voteMode==='normal'&&!S.tieUsed){S.tied=top;S.lastResult={type:'tie',title:'The votes are tied.',votes:[...S.votes]};S.screen='voteResults';render();return;}S.lastResult={type:'noElimination',title:'Still tied — no elimination.',votes:[...S.votes]};if(S.round===3)finish('culprit','The final vote ended without a unique elimination, so the culprit survived the last round.');S.screen=S.winner?'final':'voteResults';render();return;}const target=top[0];eliminate(target,[...S.votes]);}
function eliminate(id,votes){const p=byId(id);S.active=S.active.filter(x=>x!==id);p.active=false;S.eliminated.push({id:p.id,name:p.name,role:p.role,round:S.round,clueText:p.clueText});if(p.role==='culprit'){S.evidenceBoard.push({playerName:p.name,round:S.round,text:p.clueText,altered:true});finish('innocents',`The group eliminated the culprit in round ${S.round}.`);S.lastResult={type:'eliminated',title:'The culprit was caught!',target:id,votes};S.screen='voteResults';render();return;}S.evidenceBoard.push({playerName:p.name,round:S.round,text:p.clueText,altered:false});S.lastResult={type:'eliminated',title:'An innocent player was eliminated.',target:id,votes};if(S.round===3){finish('culprit','The culprit survived through round 3.');S.screen='voteResults';}else S.screen='voteResults';render();}
function finish(winner,why){S.winner=winner;S.winnerReason=why;if(winner==='culprit'){const c=culprit();S.rewardShares=[{p:c,points:1000}];}else{const remaining=S.active.map(byId).filter(p=>p.role==='innocent').sort((a,b)=>a.id-b.id);let share=Math.floor(1000/remaining.length),rem=1000-share*remaining.length;S.rewardShares=remaining.map(p=>({p,points:share+(rem-->0?1:0)}));} }
function continueRound(){S.round++;S.tieUsed=false;S.lastResult=null;S.votes=[];S.tied=[];S.voteMode='normal';S.screen='investigation';render();}
function beginShowdown(){S.specialIndex=0;S.specialVotes=[];S.screen='showdown';render();}
function submitShowdown(){const choice=document.querySelector('input[name="showdownChoice"]:checked');if(!choice){$('#sdError').textContent='Choose accuse or stand down.';return;}const player=S.active[S.specialIndex];const other=S.active.find(id=>id!==player);S.specialVotes.push({player,choice:choice.value,target:choice.value==='accuse'?other:null});if(S.specialIndex===0){S.specialIndex=1;S.screen='passShowdown';render();}else resolveShowdown();}
function resolveShowdown(){const accusations=S.specialVotes.filter(v=>v.choice==='accuse');if(accusations.length===1){const target=accusations[0].target;const p=byId(target);if(p.role==='culprit'){S.active=S.active.filter(id=>id!==target);p.active=false;S.eliminated.push({id:p.id,name:p.name,role:p.role,round:3,clueText:p.clueText});S.evidenceBoard.push({playerName:p.name,round:3,text:p.clueText,altered:true});finish('innocents',`${byId(accusations[0].player).name} accused while the other player stood down. The accusation caught the culprit.`);}else{S.active=S.active.filter(id=>id!==target);p.active=false;S.eliminated.push({id:p.id,name:p.name,role:p.role,round:3,clueText:p.clueText});S.evidenceBoard.push({playerName:p.name,round:3,text:p.clueText,altered:false});finish('culprit','The innocent player was accused and eliminated in the final showdown.');}}else finish('culprit',accusations.length===2?'Both players accused each other. The mutual accusation left the culprit in the game.':'Both players stood down, so the culprit survived.');S.lastResult={type:'showdown',title:'Final showdown resolved.',votes:[],message:accusations.length===1?`${byId(accusations[0].player).name} chose to accuse; the other player stood down.`:accusations.length===2?'Both players accused each other.':'Both players stood down.'};S.screen='voteResults';render();}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 switch(a){case'go-setup':S.error='';S.nameDraft=[];S.playerCount=4;setScreen('setup');break;case'rules':setScreen('rules');break;case'home':setScreen('home');break;case'reset-home':S.players=[];S.active=[];S.case=null;S.winner=null;S.nameDraft=[];setScreen('home');break;case'start-game':startGame();break;case'reveal-role':S.roleStage='shown';render();break;case'hide-role':S.roleStage='hidden';render();break;case'next-role':if(S.roleIndex<S.players.length-1){S.roleIndex++;S.roleStage='ready';render();}else{S.screen='investigation';render();}break;case'start-vote':if(S.round===3&&S.active.length===2){S.screen='showdownIntro';render();}else startVoting();break;case'continue-vote':S.screen='vote';render();break;case'start-revote':S.tieUsed=true;startVoting('revote',S.tied);break;case'next-round':continueRound();break;case'begin-showdown':beginShowdown();break;case'submit-showdown':submitShowdown();break;case'continue-showdown':S.screen='showdown';render();break;case'final':S.screen='final';render();break;case'continue-after-vote':continueRound();break;}
});
app.addEventListener('change',e=>{if(e.target.id==='playerCount'){let old=[];for(let i=0;i<8;i++){const x=$(`#player${i}`);old[i]=x?x.value:'';}S.nameDraft=old;S.playerCount=+e.target.value;S.error='';render();}});
app.addEventListener('submit',e=>{if(e.target.id==='voteForm'){e.preventDefault();submitVote();}});
// The shared-device handoff deliberately clears each private panel before the next player sees the device.
render();
</script>
</body>
